name: Synthetic Monitor

on:
  # Run every 5 minutes
  schedule:
    - cron: "*/5 * * * *"
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      run_once:
        description: "Run a single synthetic check and exit"
        required: false
        default: "true"

# Prevent overlapping runs — if a check is still running when the next
# 5-minute window fires, cancel the old one.
concurrency:
  group: synthetic-monitor
  cancel-in-progress: true

jobs:
  synthetic-check:
    name: Synthetic On-Chain Donation Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # required for actions/checkout

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Install only the backend deps needed for the Stellar SDK
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies (stellar-sdk only)
        working-directory: backend
        run: npm ci --omit=dev --ignore-scripts

      - name: Run synthetic donation check
        env:
          # Secret key for the synthetic donor account (pre-funded testnet keypair).
          # SYNTHETIC_DONOR_SECRET_KEY must be configured as a repository secret.
          # The script will fail if it is not set — no auto-generation occurs.
          SYNTHETIC_SECRET_KEY: ${{ secrets.SYNTHETIC_DONOR_SECRET_KEY }}
          CONTRACT_ID: ${{ vars.SYNTHETIC_CONTRACT_ID || 'CCG3QSD7FWTZ5W7NG2N7UDYWYVXF3I2NY5JGT3QPTZ6KHOIKUHMMJ6BT' }}
          STELLAR_NETWORK: testnet
          HORIZON_URL: https://horizon-testnet.stellar.org
          SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          SYNTHETIC_PROJECT_ID: ${{ vars.SYNTHETIC_PROJECT_ID || 'project-001' }}
          SYNTHETIC_AMOUNT_STROOPS: "100000"
          RUN_ONCE: "true"
          # Push results to Prometheus Push Gateway if configured
          PROMETHEUS_PUSH_URL: ${{ secrets.PROMETHEUS_PUSH_URL }}
          # Make require() resolve stellar-sdk from the backend node_modules
          NODE_PATH: backend/node_modules
        run: node scripts/synthetic-monitor.js

      - name: Report check status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Synthetic donation check passed"
          else
            echo "❌ Synthetic donation check FAILED — Horizon/RPC/contract may be degraded"
            echo "Check Stellar status: https://status.stellar.org"
            echo "Check contract explorer: https://stellar.expert/explorer/testnet/contract/${{ vars.SYNTHETIC_CONTRACT_ID || 'CCG3QSD7FWTZ5W7NG2N7UDYWYVXF3I2NY5JGT3QPTZ6KHOIKUHMMJ6BT' }}"
          fi
